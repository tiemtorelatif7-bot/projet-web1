<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un Hôtel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="logo.jpg" alt=" Logo de BOBO-DIOULASSO" class="logo" width="90" height="90">
            <h1>Planifiez votre Séjour</h1>
        </div>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="patrimoine.html">Patrimoine</a>
        <a href="reservation.html">Réservation d'hôtel</a>
        <a href="galerie.html">Galerie</a>
    </nav>

    <main>
        <h2>Formulaire de Réservation d'Hôtel</h2>
        
        <form action="#" method="POST">
            <label for="nom">Nom  :</label>
            <input type="text" id="nom" name="nom">

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom">

            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" required placeholder="exemple@mail.com">

            <label for="hotel">Choisissez votre hôtel :</label>
            <select id="hotel" name="hotel" required>
                <option value="">-- Veuillez choisir un hôtel --</option>
                <option value="hotel-luxe">Hôtel SISSIMAN</option>
                <option value="hotel-confort">IBA Hôtel</option>
                <option value="hotel-eco">Auberge  </option>
                <option value="hotel-confort">Pacific Hôtel </option>
                <option value="hotel-conforst">Hôtel Villa </option>
                <option value="hotel-luxe"> Hôtel l'Auberge </option>
                <option value="hotel-luxe">Oasis Lawafossi </option>
            </select>

            <label for="arrivee">Date d'arrivée :</label>
            <input type="date" id="arrivee" name="arrivee" required>

            <label for="depart">Date de départ :</label>
            <input type="date" id="depart" name="depart" required>

            <label for="personnes">Nombre de personnes :</label>
            <input type="number" id="personnes" name="personnes" min="1" max="10" value="1" required>

            <label for="demandes">Demandes particulières :</label> 
            <textarea id="demandes" name="demandes" rows="4" placeholder="Lit bébé, vue sur la rue, ..."></textarea>

            <button type="submit">Confirmer ma demande de réservation</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Projet Prog Web - Tous droits réservés</p>
    </footer>

</body>
</html>
